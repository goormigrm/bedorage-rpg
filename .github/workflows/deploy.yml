name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      check:
        description: '시험까지 돌린다 (원격 개발 PC 밖에서 시험 없이 올렸을 때)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 시험(단위 · 화면)은 원격 개발 PC 에서 푸시 전에 돌린다 — 여기서 또 돌리면 배포가 3분(화면 시험 1분 48초) → 1분 안
      # (2026-10-24 사용자: "PC 에서 진행하고 깃허브에는 올리는 것만 하는 게 더 빠르지 않아?"). 손으로 돌릴 때 check 를 켜면 예전처럼 다 본다
      - if: inputs.check
        run: npm test
      - run: npm run build
      # 화면 시험 (2026-10-08 — tools/uitest.mjs): 빌드한 것을 띄워 헤드리스 크로미움으로 판을 열고
      # 가방 칸 이름 · 설명 풍선 자리 · 창 겹침 · 사격 막기 · 3인칭 조준 · 잡히지 않은 오류를 본다. 실패하면 배포하지 않는다
      - name: 화면 시험
        if: inputs.check
        run: |
          npx playwright install --with-deps chromium
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 1 40); do curl -sf http://localhost:4173/bedorage-rpg/ > /dev/null && break; sleep 1; done
          node tools/uitest.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
